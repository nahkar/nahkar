name: Snake

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      # The contribution grid in the site's palette: void → violet → lilac.
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ceb7ff&color_dots=#140a2b,#3b1f73,#6d3bff,#9361ff,#b377ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: redraw the snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
