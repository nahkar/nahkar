name: Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/stats.mjs, .github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # STATS_TOKEN (a classic PAT with read:user) is optional: it lets the
      # cards count private contributions the default token cannot see.
      - run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh stats cards"
            # The Medium workflow may have committed in the meantime.
            git pull --rebase
            git push
          fi
